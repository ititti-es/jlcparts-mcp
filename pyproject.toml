[project]
name = "jlcparts-mcp"
version = "0.2.0"
description = "MCP server for choosing JLCPCB assembly parts: local parametric search over the jlcparts mirror, live stock from JLCPCB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
jlcparts-mcp = "jlcparts_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlcparts_mcp"]
